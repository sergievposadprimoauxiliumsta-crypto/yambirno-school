name: Sync School Snapshot (RF Resilience)

on:
  schedule:
    # Проверка обновлений Google Таблицы каждые 30 минут (коммит только при реальных изменениях)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-school-snapshot
  cancel-in-progress: false

jobs:
  sync-snapshot:
    name: Обновление резервного JSON-снапшота
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and validate public Google Sheets CSV
        id: build_snapshot
        env:
          SHEET_PANEL_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1w6Z_wfOYJVKxtMHhz9ut6euiLY3YtkkOGNj1Wd_Pr0yJTdmKruN19uZYEyXpLZQSQPQgGHH9i84a/pub?output=csv'
          SHEET_PUBS_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1w6Z_wfOYJVKxtMHhz9ut6euiLY3YtkkOGNj1Wd_Pr0yJTdmKruN19uZYEyXpLZQSQPQgGHH9i84a/pub?gid=809598510&single=true&output=csv'
          SNAPSHOT_PATH: 'data/school-snapshot.json'
        run: |
          python3 - <<'PYEOF'
          import csv
          import datetime
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          PANEL_URL = os.environ["SHEET_PANEL_URL"]
          PUBS_URL = os.environ["SHEET_PUBS_URL"]
          SNAPSHOT_PATH = os.environ["SNAPSHOT_PATH"]

          MAX_CSV_BYTES = 2 * 1024 * 1024  # 2 МБ защитный лимит на один лист
          MAX_ROWS = 500
          MAX_COLS = 15
          FETCH_TIMEOUT = 15

          PANEL_MARKERS = ("новости", "расписание", "класс", "табло", "меню")
          FORBIDDEN_FEEDBACK_HEADERS = ("номер талона", "контакт", "комментарий")


          def fetch_csv_text(url: str) -> str:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "YambirnoSchoolSnapshotBot/1.0 (+GitHubActions)",
                      "Accept": "text/csv,text/plain;q=0.9,*/*;q=0.1",
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=FETCH_TIMEOUT) as resp:
                  status = getattr(resp, "status", 200)
                  if status != 200:
                      raise RuntimeError(f"HTTP {status}")
                  raw = resp.read(MAX_CSV_BYTES + 1)
                  if len(raw) > MAX_CSV_BYTES:
                      raise RuntimeError("CSV response exceeds 2 MB safety limit")
                  return raw.decode("utf-8-sig", errors="replace")


          def is_valid_csv(text: str, markers=()) -> bool:
              if not isinstance(text, str) or len(text.strip()) < 15:
                  return False
              head = text[:320].strip().lower()
              if head.startswith(("<!doctype", "<html", "<head", "<script", "{")):
                  return False
              if "," not in text and "\n" not in text:
                  return False
              lower_all = text.lower()
              if markers and not any(m in lower_all for m in markers):
                  return False
              return True


          def parse_and_trim_csv(text: str, preserve_row_indices: bool = False):
              reader = csv.reader(io.StringIO(text, newline=""))
              rows = []
              for raw_row in reader:
                  if len(rows) >= MAX_ROWS:
                      break
                  cleaned = [cell.strip() for cell in raw_row[:MAX_COLS]]
                  while cleaned and cleaned[-1] == "":
                      cleaned.pop()
                  rows.append(cleaned)

              # Удаляем пустые хвосты (в таблице Google часто сотни пустых строк)
              while rows and not any(rows[-1]):
                  rows.pop()

              if not preserve_row_indices:
                  rows = [r for r in rows if any(r)]

              return rows


          def looks_like_private_feedback_sheet(rows) -> bool:
              if not rows:
                  return False
              first_row_lower = " ".join(c.lower() for c in rows[0])
              return all(marker in first_row_lower for marker in FORBIDDEN_FEEDBACK_HEADERS)


          def load_existing_snapshot(path: str):
              if not os.path.exists(path):
                  return None
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, dict):
                      return data
              except Exception as exc:
                  print(f"[WARN] Could not read existing snapshot: {exc}")
              return None


          existing = load_existing_snapshot(SNAPSHOT_PATH)
          existing_panel = existing.get("panelRows") if isinstance(existing, dict) else None
          existing_pubs = existing.get("publicationsRows") if isinstance(existing, dict) else None

          panel_rows = None
          pubs_rows = None
          errors = []

          try:
              panel_csv = fetch_csv_text(PANEL_URL)
              if not is_valid_csv(panel_csv, PANEL_MARKERS):
                  raise ValueError("Panel CSV failed structural marker validation")
              parsed_panel = parse_and_trim_csv(panel_csv, preserve_row_indices=False)
              if looks_like_private_feedback_sheet(parsed_panel):
                  raise ValueError("Security block: panel CSV matched private feedback headers")
              if len(parsed_panel) < 3:
                  raise ValueError("Panel CSV has fewer than 3 non-empty rows")
              panel_rows = parsed_panel
              print(f"[OK] Panel sheet fetched: {len(panel_rows)} active rows")
          except Exception as exc:
              errors.append(f"panel: {exc}")
              print(f"[WARN] Panel fetch failed: {exc}")
              if isinstance(existing_panel, list) and len(existing_panel) >= 3:
                  panel_rows = existing_panel
                  print("[INFO] Preserved previous valid panelRows from snapshot")

          try:
              pubs_csv = fetch_csv_text(PUBS_URL)
              if not is_valid_csv(pubs_csv):
                  raise ValueError("Publications CSV failed validation")
              # preserve_row_indices=True сохраняет стабильные ID ссылок #pub-<rowIndex>
              parsed_pubs = parse_and_trim_csv(pubs_csv, preserve_row_indices=True)
              if looks_like_private_feedback_sheet(parsed_pubs):
                  raise ValueError("Security block: publications CSV matched private feedback headers")
              pubs_rows = parsed_pubs
              print(f"[OK] Publications sheet fetched: {len(pubs_rows)} rows (with header)")
          except Exception as exc:
              errors.append(f"publications: {exc}")
              print(f"[WARN] Publications fetch failed: {exc}")
              if isinstance(existing_pubs, list):
                  pubs_rows = existing_pubs
                  print("[INFO] Preserved previous valid publicationsRows from snapshot")

          if panel_rows is None:
              print("[ERROR] Neither live panel CSV nor previous snapshot is available.")
              sys.exit(1)

          if pubs_rows is None:
              pubs_rows = []

          # Проверяем, изменились ли реальные данные (игнорируя метку времени updatedAt)
          content_changed = (
              existing is None
              or existing.get("schemaVersion") != 1
              or existing.get("panelRows") != panel_rows
              or existing.get("publicationsRows") != pubs_rows
          )

          if not content_changed:
              print("[OK] Snapshot data unchanged. Skipping file write and commit.")
              sys.exit(0)

          msk_tz = datetime.timezone(datetime.timedelta(hours=3))
          now_msk = datetime.datetime.now(msk_tz)

          snapshot_payload = {
              "schemaVersion": 1,
              "updatedAt": now_msk.isoformat(timespec="seconds"),
              "updatedLabel": now_msk.strftime("%d.%m.%Y %H:%M"),
              "panelRows": panel_rows,
              "publicationsRows": pubs_rows,
          }

          os.makedirs(os.path.dirname(SNAPSHOT_PATH), exist_ok=True)
          with open(SNAPSHOT_PATH, "w", encoding="utf-8", newline="\n") as f:
              json.dump(snapshot_payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"[OK] Wrote updated snapshot to {SNAPSHOT_PATH} ({os.path.getsize(SNAPSHOT_PATH)} bytes)")
          if errors:
              print(f"[WARN] Completed with partial fallback warnings: {'; '.join(errors)}")
          PYEOF

      - name: Commit and push snapshot if changed
        id: commit_snapshot
        run: |
          if [ ! -f data/school-snapshot.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet -- data/school-snapshot.json && [ -z "$(git ls-files --others --exclude-standard -- data/school-snapshot.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/school-snapshot.json
          git commit -m "chore(data): update school snapshot"

          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages rebuild (if branch deployment)
        if: steps.commit_snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
